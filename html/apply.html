<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参加申請 | Future Summit 2026</title>
    <meta name="description" content="Future Summit 2026への参加申請フォームです。">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="container nav">
            <a href="/html/index.html" class="brand" aria-label="Future Summit Home">
                <span class="brand-mark">F</span>
                <span>Future Summit</span>
            </a>
            <a href="/html/index.html" class="btn btn-secondary">大会トップへ戻る</a>
        </div>
    </header>

    <main class="application-page">
        <div class="container application-layout">
            <section class="application-intro">
                <span class="eyebrow">Future Summit 2026</span>
                <h1>参加申請</h1>
                <p class="lead">大会への参加をご希望の方は、以下のフォームに必要事項を入力してください。</p>
                <div class="application-info">
                    <div><small>開催日</small><strong>2026年10月16日</strong></div>
                    <div><small>会場</small><strong>Tokyo Hall</strong></div>
                    <div><small>参加費</small><strong>無料</strong></div>
                </div>
            </section>

            <section class="card application-card" aria-labelledby="application-heading">
                <h2 id="application-heading">申請者情報</h2>
                <p class="form-note">入力内容を確認してから送信してください。</p>
                <form action="/apply" method="post">
                    <div class="form-grid">
                        <label>
                            <span>氏名 <b>必須</b></span>
                            <input type="text" name="name" autocomplete="name" required placeholder="例：山田 太郎">
                        </label>
                        <label>
                            <span>メールアドレス <b>必須</b></span>
                            <input type="email" name="email" autocomplete="email" required placeholder="例：hello@example.com">
                        </label>
                    </div>
                    <label>
                        <span>参加区分 <b>必須</b></span>
                        <select name="category" required>
                            <option value="" selected disabled>選択してください</option>
                            <option value="general">一般参加</option>
                            <option value="student">学生</option>
                            <option value="speaker">登壇・関係者</option>
                        </select>
                    </label>
                    <label>
                        <span>意気込み・質問 <small>任意</small></span>
                        <textarea name="message" rows="5" placeholder="大会への質問や期待していることがあれば入力してください"></textarea>
                    </label>
                    <label class="consent-label">
                        <input type="checkbox" name="consent" required>
                        <span>大会運営からの連絡および申請内容の取り扱いに同意します。 <b>必須</b></span>
                    </label>
                    <button type="submit" class="btn btn-primary">申請を送信する</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <div class="container footer-inner">
            <div>© 2026 Future Summit</div>
            <div>お問い合わせ: hello@futuresummit.jp</div>
        </div>
    </footer>
</body>
</html>
